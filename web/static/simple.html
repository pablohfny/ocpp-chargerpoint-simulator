<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregador Simplificado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }

        .header {
            background: #16213e;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0f3460;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #00d9ff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4757;
        }

        .status-dot.connected {
            background: #2ed573;
        }

        .header-link {
            color: #888;
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid #0f3460;
            padding: 0.35rem 0.75rem;
            border-radius: 4px;
        }

        .header-link:hover {
            color: #00d9ff;
            border-color: #00d9ff;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 2rem 1rem 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .battery-ring {
            position: relative;
            width: 260px;
            height: 260px;
        }

        .battery-ring svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .ring-track {
            fill: none;
            stroke: #0f3460;
            stroke-width: 14;
        }

        .ring-value {
            fill: none;
            stroke: #2ed573;
            stroke-width: 14;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.6s ease, stroke 0.3s ease;
        }

        .ring-value.idle { stroke: #00d9ff; }
        .ring-value.faulted { stroke: #ff4757; }
        .ring-value.suspended { stroke: #e056fd; }

        .battery-readout {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
        }

        .battery-percent {
            font-size: 4rem;
            font-weight: bold;
            line-height: 1;
        }

        .battery-percent span {
            font-size: 1.75rem;
            color: #888;
        }

        .battery-caption {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .connector-status {
            padding: 0.4rem 1.25rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            background: #747d8c;
            color: #fff;
        }

        .status-available { background: #2ed573; color: #000; }
        .status-charging { background: #2ed573; color: #000; }
        .status-preparing { background: #1e90ff; color: #fff; }
        .status-finishing { background: #ffa502; color: #000; }
        .status-reserved { background: #ffa502; color: #000; }
        .status-unavailable { background: #747d8c; color: #fff; }
        .status-faulted { background: #ff4757; color: #fff; }
        .status-suspendedev { background: #e056fd; color: #fff; }
        .status-suspendedevse { background: #be2edd; color: #fff; }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            width: 100%;
        }

        .info-item {
            background: #16213e;
            border: 1px solid #0f3460;
            padding: 0.75rem;
            border-radius: 8px;
            text-align: center;
        }

        .info-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 0.2rem;
        }

        .btn-primary-action {
            width: 100%;
            padding: 1.25rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            background: #2ed573;
            color: #000;
            transition: filter 0.2s, transform 0.1s;
        }

        .btn-primary-action:hover:not(:disabled) {
            filter: brightness(1.1);
        }

        .btn-primary-action:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn-primary-action.stop {
            background: #ff4757;
            color: #fff;
        }

        .btn-primary-action:disabled {
            background: #747d8c;
            color: #ccc;
            cursor: not-allowed;
        }

        .message {
            width: 100%;
            min-height: 1.25rem;
            text-align: center;
            font-size: 0.85rem;
            color: #888;
        }

        .message.error { color: #ff4757; }
        .message.success { color: #2ed573; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Carregador</h1>
        <div class="header-right">
            <div class="connection-status">
                <div class="status-dot" id="connectionDot"></div>
                <span id="connectionText">Desconectado</span>
            </div>
            <a class="header-link" href="/">Painel completo</a>
        </div>
    </div>

    <div class="container">
        <div class="battery-ring">
            <svg viewBox="0 0 120 120">
                <circle class="ring-track" cx="60" cy="60" r="52"></circle>
                <circle class="ring-value" id="ringValue" cx="60" cy="60" r="52"
                        stroke-dasharray="326.7" stroke-dashoffset="326.7"></circle>
            </svg>
            <div class="battery-readout">
                <div class="battery-percent" id="batteryPercent">--<span>%</span></div>
                <div class="battery-caption">Bateria</div>
            </div>
        </div>

        <div class="connector-status" id="connectorStatus">--</div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">Energia</div>
                <div class="info-value" id="energyValue">0,00 kWh</div>
            </div>
            <div class="info-item">
                <div class="info-label">Transacao</div>
                <div class="info-value" id="transactionValue">--</div>
            </div>
        </div>

        <button class="btn-primary-action" id="actionButton" disabled>Carregando...</button>
        <div class="message" id="message"></div>
    </div>

    <script>
        const API = '/api/v1';
        const CONNECTOR_ID = 1;
        const ID_TAG = 'SIMPLE_UI';
        const RING_CIRCUMFERENCE = 2 * Math.PI * 52;

        // Statuses in which a charge is under way, so the button offers to stop it.
        const ACTIVE_STATUSES = ['Preparing', 'Charging', 'SuspendedEV', 'SuspendedEVSE'];

        let currentStatus = null;
        let busy = false;

        function setMessage(text, kind) {
            const element = document.getElementById('message');
            element.textContent = text || '';
            element.className = 'message' + (kind ? ' ' + kind : '');
        }

        async function callApi(path, body) {
            const response = await fetch(API + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body || {})
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error((payload.error && payload.error.message) || 'Falha na requisicao');
            }
            return payload;
        }

        // Plugging an already plugged cable is not an error for this flow.
        async function callApiTolerant(path, body) {
            try {
                return await callApi(path, body);
            } catch (error) {
                return null;
            }
        }

        function renderConnector(connector) {
            currentStatus = connector.status;

            const percent = connector.batteryPercent || 0;
            document.getElementById('batteryPercent').innerHTML = percent + '<span>%</span>';

            const ring = document.getElementById('ringValue');
            ring.style.strokeDasharray = RING_CIRCUMFERENCE;
            ring.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - percent / 100);
            ring.className.baseVal = 'ring-value ' + ringModifier(connector.status);

            const statusElement = document.getElementById('connectorStatus');
            statusElement.textContent = statusLabel(connector.status);
            statusElement.className = 'connector-status status-' + connector.status.toLowerCase();

            document.getElementById('energyValue').textContent =
                ((connector.meterValue || 0) / 1000).toFixed(2).replace('.', ',') + ' kWh';
            document.getElementById('transactionValue').textContent =
                connector.currentTransaction || '--';

            renderButton(connector.status);
        }

        function ringModifier(status) {
            if (status === 'Faulted') return 'faulted';
            if (status === 'SuspendedEV' || status === 'SuspendedEVSE') return 'suspended';
            if (status === 'Charging') return '';
            return 'idle';
        }

        function statusLabel(status) {
            const labels = {
                Available: 'Disponivel',
                Preparing: 'Preparando',
                Charging: 'Carregando',
                SuspendedEV: 'Pausado (veiculo)',
                SuspendedEVSE: 'Pausado (carregador)',
                Finishing: 'Finalizando',
                Reserved: 'Reservado',
                Unavailable: 'Indisponivel',
                Faulted: 'Com falha'
            };
            return labels[status] || status;
        }

        function renderButton(status) {
            const button = document.getElementById('actionButton');
            const isActive = ACTIVE_STATUSES.includes(status);

            if (busy) {
                button.disabled = true;
                return;
            }

            if (isActive) {
                button.textContent = 'Parar recarga';
                button.className = 'btn-primary-action stop';
                button.disabled = false;
                return;
            }

            button.textContent = 'Iniciar recarga';
            button.className = 'btn-primary-action';
            // Finishing, Faulted, Reserved and Unavailable cannot start a charge.
            button.disabled = status !== 'Available';
        }

        // Drives the local charge flow through the existing API:
        // plug the cable, move to Preparing, authorize the tag, then start the
        // transaction so the CSMS assigns a transaction id.
        async function startCharging() {
            busy = true;
            renderButton(currentStatus);
            setMessage('Iniciando recarga...');

            try {
                await callApiTolerant('/actions/connectors/' + CONNECTOR_ID + '/plug');
                await callApi('/actions/connectors/' + CONNECTOR_ID + '/preparing');
                await callApi('/ocpp/trigger/authorize', { connectorId: CONNECTOR_ID, idTag: ID_TAG });
                await callApi('/ocpp/trigger/start-transaction', { connectorId: CONNECTOR_ID, idTag: ID_TAG });
                setMessage('Recarga solicitada. Aguardando o servidor...', 'success');
            } catch (error) {
                setMessage(error.message, 'error');
            } finally {
                busy = false;
                refresh();
            }
        }

        // Stopping puts the connector in Finishing, which makes the simulator
        // send the OCPP StopTransaction, then the cable is released.
        async function stopCharging() {
            busy = true;
            renderButton(currentStatus);
            setMessage('Parando recarga...');

            try {
                await callApi('/actions/connectors/' + CONNECTOR_ID + '/stop');
                await callApiTolerant('/actions/connectors/' + CONNECTOR_ID + '/unplug');
                setMessage('Recarga encerrada.', 'success');
            } catch (error) {
                setMessage(error.message, 'error');
            } finally {
                busy = false;
                refresh();
            }
        }

        document.getElementById('actionButton').addEventListener('click', () => {
            if (ACTIVE_STATUSES.includes(currentStatus)) {
                stopCharging();
            } else {
                startCharging();
            }
        });

        async function refresh() {
            try {
                const [connectorResponse, connectionResponse] = await Promise.all([
                    fetch(API + '/status/connectors/' + CONNECTOR_ID),
                    fetch(API + '/status/connection')
                ]);

                if (connectorResponse.ok) {
                    renderConnector(await connectorResponse.json());
                }

                if (connectionResponse.ok) {
                    const connection = await connectionResponse.json();
                    document.getElementById('connectionDot').className =
                        'status-dot' + (connection.connected ? ' connected' : '');
                    document.getElementById('connectionText').textContent =
                        connection.connected ? 'Conectado' : 'Desconectado';
                }
            } catch (error) {
                setMessage('Simulador fora do ar', 'error');
            }
        }

        refresh();
        setInterval(refresh, 2000);
    </script>
</body>
</html>
